services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tbm
      POSTGRES_USER: tbm
      POSTGRES_PASSWORD: tbm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbm -d tbm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: tbm
      DB_USER: tbm
      DB_PASSWORD: tbm
      JWT_SECRET: local-dev-only-secret-change-me-please-32bytes
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      # Defaults to "demo" (seeded). Override with `SPRING_PROFILES_ACTIVE=no-demo docker compose
      # up` for a clean, demo-data-free database.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
