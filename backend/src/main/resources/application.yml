server:
  port: 8080

spring:
  profiles:
    # Demo-data seeding (Liquibase changesets tagged context:demo) is active by default so the
    # documented docker-compose/local startup keeps working with zero extra steps. Override with
    # SPRING_PROFILES_ACTIVE=no-demo to start with a clean, demo-data-free database (spec
    # 005-seed-data-relabel FR-014/015).
    active: demo
  application:
    name: tenant-beneficiary-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tbm}
    username: ${DB_USER:tbm}
    password: ${DB_PASSWORD:tbm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Must always be explicitly set (never left null): an unset/null contexts value makes
    # Liquibase apply NO context filtering at all, running every changeset regardless of its
    # context tag — the opposite of what's needed here. "no-demo-data" is a sentinel that never
    # matches any changeset's context:demo tag, so context:demo changesets are skipped by default
    # (overridden to "demo" below when that profile is active).
    contexts: no-demo-data

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.tbm: INFO

---
spring:
  config:
    activate:
      on-profile: demo
  liquibase:
    contexts: demo

---
spring:
  config:
    activate:
      on-profile: no-demo
  # No-op: the base document's "no-demo-data" sentinel already skips context:demo changesets by
  # default. This document exists so "no-demo" is a real, named profile (self-documenting in
  # logs and docker-compose usage) rather than relying on callers to know that any non-"demo"
  # profile happens to produce the same effect.
  liquibase:
    contexts: no-demo-data
